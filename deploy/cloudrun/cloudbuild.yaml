# Build the Cloud Run image on Google Cloud Build (amd64, close to the registry) and push it.
#   gcloud builds submit --config deploy/cloudrun/cloudbuild.yaml --substitutions _IMAGE=... .
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "deploy/cloudrun/Dockerfile", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 3600s
